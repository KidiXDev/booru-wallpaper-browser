name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  QT_VERSION: 6.9.*

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            qt_arch: linux_gcc_64
          - os: windows-latest
            target: windows-x86_64
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - run: cargo build --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          # Needs Qt 6 (qtdeclarative) from the system, there is no bundled copy
          tar -czf dist/wallpaper-browser-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/release wallpaper-browser

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "wallpaper-browser"
          New-Item -ItemType Directory $dir
          Copy-Item target/release/wallpaper-browser.exe $dir
          windeployqt --release --qmldir qml "$dir/wallpaper-browser.exe"
          New-Item -ItemType Directory dist
          Compress-Archive $dir "dist/wallpaper-browser-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
